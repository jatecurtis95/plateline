<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Plateline</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="signin" id="gate" hidden>
  <form class="box" id="gate-form">
    <svg class="mark" width="38" height="38" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="4.5" y="10.5" width="39" height="27" rx="5.5" stroke="currentColor" stroke-width="3"/><circle cx="11" cy="17" r="1.9" fill="currentColor"/><circle cx="37" cy="17" r="1.9" fill="currentColor"/><circle cx="11" cy="31" r="1.9" fill="currentColor"/><circle cx="37" cy="31" r="1.9" fill="currentColor"/><path d="M12 24h9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M31 24h5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="24" r="4.5" fill="var(--accent)"/></svg>
    <h1>Plateline</h1>
    <input id="un" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Username">
    <input id="pc" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <button class="btn" type="submit">Sign in</button>
    <p class="err" id="gate-err"></p>
  </form>
</div>

<div class="shell" id="app" hidden>
  <aside class="sidebar">
    <a class="logo" href="#/today">
      <svg width="24" height="24" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect x="4.5" y="10.5" width="39" height="27" rx="5.5" stroke="currentColor" stroke-width="3"/><circle cx="11" cy="17" r="1.9" fill="currentColor"/><circle cx="37" cy="17" r="1.9" fill="currentColor"/><circle cx="11" cy="31" r="1.9" fill="currentColor"/><circle cx="37" cy="31" r="1.9" fill="currentColor"/><path d="M12 24h9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M31 24h5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="24" r="4.5" fill="var(--accent)"/></svg>
      <span>Plateline</span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/today" data-nav="today"><span class="ico" aria-hidden="true">📋</span>Today <span class="pip" id="pip-today"></span></a>
      <a href="#/board" data-nav="board"><span class="ico" aria-hidden="true">🗂️</span>Board</a>
      <a href="#/jobs" data-nav="jobs"><span class="ico" aria-hidden="true">🚗</span>Cars</a>
      <a href="#/clients" data-nav="clients"><span class="ico" aria-hidden="true">👥</span>Clients</a>
      <a href="#/money" data-nav="money"><span class="ico" aria-hidden="true">💳</span>Money <span class="pip" id="pip-money"></span></a>
      <a href="#/settings" data-nav="settings"><span class="ico" aria-hidden="true">⚙️</span>Settings</a>
    </nav>
    <div class="side-foot">
      <span class="who" id="me"></span>
      <a href="#" id="signout">Sign out</a>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
